name = "trends-guess-api"
main = "worker.js"
compatibility_date = "2024-03-01"

# KV Namespace for storing data
kv_namespaces = [
  { binding = "TRENDS_DB", id = "YOUR_KV_NAMESPACE_ID" }
]

[vars]
ENVIRONMENT = "production"

# Development environment
[env.development]
vars = { ENVIRONMENT = "development" }

# Routes
[[routes]]
pattern = "api.trends-guess.com"
custom_domain = true 