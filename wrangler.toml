# Cloudflare Pages Configuration
name = "trends-guess"

# Build Configuration
[build]
command = """
cd client && \
rm -rf node_modules package-lock.json && \
npm install --no-optional && \
npm run build
"""

[build.environment]
NODE_VERSION = "20"
NPM_FLAGS = "--no-optional"

# Build output directory
[site]
bucket = "client/dist"

# Environment variables
[env.production]
VITE_API_URL = "https://api.trends-guess.com"
VITE_ENVIRONMENT = "production"

[env.development]
VITE_API_URL = "https://dev-api.trends-guess.com"
VITE_ENVIRONMENT = "development"

# Routes configuration
[[routes]]
pattern = "/*"
handler = "index.html" 